name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & Build (Frontend + Workers)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            workers/package-lock.json

      - name: Install & Typecheck Signaling Worker
        working-directory: workers
        run: |
          npm ci
          npm run typecheck

      - name: Install, Typecheck & Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build
